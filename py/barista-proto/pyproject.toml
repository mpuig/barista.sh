[project]
name = "barista-proto"
version = "0.1.0"
description = "Generated Python contract types for barista.node.v1alpha1 and barista.guest.v1alpha1"
license = "Apache-2.0"
authors = [{ name = "Marc Puig" }]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.36.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barista"]
