site_name: Barista documentation
site_description: Session-centric compute for long-lived workloads
site_url: https://mpuig.github.io/barista.sh/
repo_url: https://github.com/mpuig/barista.sh
repo_name: mpuig/barista.sh
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Barista

docs_dir: docs
site_dir: site
strict: true

# Filing drafts, product and decision documents, and upstream findings remain
# available by direct link but are intentionally absent from the primary user
# navigation.
not_in_nav: |
  upstream-issues/**
  BRD.md
  specs/**
  adr-001-substrate-evaluation.md
  adr-002-coordination-evaluation.md
  adr-003-commercial-seam.md
  adr-004-forkd-evaluation.md
  upstream-hypeman-findings.md

theme:
  name: material
  language: en
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    scheme: default
    primary: custom
    accent: custom

plugins:
  - search:
      separator: '[\s\-\.>]+'

nav:
  - Documentation: index.md
  - Start:
      - Getting started: get-started.md
      - CLI reference: cli.md
      - Examples: examples/index.md
      - Local development: local-development.md
      - Best practices: best-practices.md
  - Concepts:
      - Overview: concepts/index.md
      - Sessions: concepts/sessions.md
      - Sleep and wake: concepts/sleep-and-wake.md
      - Snapshots: concepts/snapshots.md
      - Forks and capsules: concepts/forks-and-capsules.md
      - Lifecycle and operations: concepts/lifecycle-and-operations.md
      - Capabilities and tiers: concepts/capabilities-and-tiers.md
      - Fleet coordination: concepts/fleet-coordination.md
      - Networking and egress: concepts/networking-and-egress.md
      - Guest agent: concepts/guest-agent.md
  - API:
      - Node Agent: api/index.md
      - Guest Agent: api/guest-agent.md
      - Errors: api/errors.md
  - Platform:
      - Architecture: platform/architecture.md
      - Limits and performance: platform/limits.md
      - Known issues: platform/known-issues.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/barista.css
