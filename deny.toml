# `cargo deny check`, wired into `task lint`.
#
# This tree vendors a bundled SQLite C library and pulls bollard, reqwest and
# tonic. That is a lot of transitive surface for a daemon that creates VMs and
# holds every guest's credential, and none of it was being checked.

[advisories]
# A yanked crate is one the author withdrew, usually for a reason. Fail rather
# than warn: `Cargo.lock` is committed, so this is a deliberate act to clear.
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = [
  # reqwest is pulled in `default-features = false`. It no longer means "no TLS"
  # — reqwest 0.13 links rustls (via rustls-platform-verifier) unconditionally,
  # so certificate validation is compiled in and on. What this ban still enforces
  # is that the TLS stack stays pure-Rust: no `openssl-sys`, i.e. no OpenSSL C
  # dependency dragged in transitively. The day the node needs the native stack,
  # it should be a decision, not a surprise in an audit.
  { name = "openssl-sys" },
]

[licenses]
# Permissive only. A copyleft dependency arriving transitively is a legal
# question, and it should surface here rather than at release.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# Our own crates are Apache-2.0 (see LICENSE) but stay `publish = false` for now,
# so cargo-deny classifies them as private and skips them — the third-party tree,
# which is what this check is actually for, is still fully enforced. Apache-2.0 is
# already in the allow list above, so promoting a crate to `publish = true` would
# pass this gate unchanged.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
