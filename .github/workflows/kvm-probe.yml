# Throwaway probe: can a GitHub-hosted runner host the rank-1 substrate?
#
# The question behind it is whether CI could ever replace the local Lima VM for
# the hypeman-gated tests (T3, T7, T8, T9, T12-positive, the guest channel).
#
# **Every answer is encoded in a step's pass/fail**, and each step is named as a
# question. That is deliberate: downloading job logs from the REST API needs
# admin rights on this repository, while the *step conclusions* are public. A
# probe whose findings can only be read by an admin is a probe most people
# cannot read.
#
# For the same reason no step ends in `|| echo`. The first version did, and its
# steps reported success unconditionally — including the one that boots a VM,
# which is the only step that matters.
#
# `if: always()` throughout, so one "no" does not hide the answers after it.
# The job going red is the report, not a malfunction.
#
# Delete this workflow once the answer is recorded.
name: kvm-probe

on:
  workflow_dispatch:
  push:
    branches: [kvm-probe]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # The arch matters: this project is developed against an aarch64
        # substrate, and a KVM answer for x86_64 does not transfer — different
        # virtualisation extensions, different hypervisor support.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "fact: what machine is this"
        if: always()
        run: |
          echo "runner=${{ matrix.runner }} arch=$(uname -m) kernel=$(uname -r)"
          echo "cpus=$(nproc) mem=$(free -h | awk '/^Mem:/{print $2}')"
          echo "outer-hypervisor=$(systemd-detect-virt || true)"

      - name: "q1: does /dev/kvm exist"
        if: always()
        run: test -e /dev/kvm

      - name: "q2: is /dev/kvm writable WITHOUT the udev rule"
        if: always()
        run: test -w /dev/kvm

      - name: "q3: does GitHub's udev rule apply cleanly"
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "q4: is /dev/kvm writable AFTER the udev rule"
        if: always()
        run: test -w /dev/kvm

      - name: "q5: does the CPU expose virtualisation extensions"
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker
          kvm-ok

      - name: "q6: does a guest actually boot under -accel kvm"
        if: always()
        run: |
          sudo apt-get install -y -qq qemu-system
          # No kernel, no disk: QEMU must still *initialise the accelerator*,
          # which is the thing under test. `-accel kvm` without a fallback means
          # a runner that cannot use KVM fails here rather than silently
          # dropping to TCG and looking like success.
          timeout 60 qemu-system-$(uname -m) \
            -accel kvm -machine ${{ matrix.runner == 'ubuntu-24.04-arm' && 'virt' || 'q35' }} \
            ${{ matrix.runner == 'ubuntu-24.04-arm' && '-cpu host' || '' }} \
            -nographic -no-reboot -m 256 -display none \
            -monitor none -serial null -bios /dev/null 2>&1 | tee /tmp/qemu.log || true
          # QEMU exits non-zero for the missing BIOS whatever happens, so the
          # verdict is whether it complained about the *accelerator*.
          ! grep -qiE "failed to initialize kvm|kvm not supported|could not access KVM|No accelerator found" /tmp/qemu.log
