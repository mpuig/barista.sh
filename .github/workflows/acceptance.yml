# The substrate-gated acceptance tier: everything `ci.yml` cannot claim.
#
# nap-006 task 3.3's decision (2026-08-08): a GitHub-hosted **amd64** runner is
# the canonical verification environment for the hypeman tier, because it is the
# one option with no known counter-argument:
#   - standard Linux runners expose /dev/kvm (nested virt) since 2024;
#   - hypeman's linux/amd64 release embeds correct-arch guest binaries, so this
#     runs UNPATCHED — no initrd graft, no version skew on any number recorded
#     here (docs/upstream-hypeman-findings.md §1 is arm64-only);
#   - no self-hosted hardware to keep alive.
#
# Deliberately not a required PR gate yet: this workflow has never run (the
# repo had no remote when it was written), and a gate that fails for setup
# reasons blocks everything while teaching nothing. Trigger it manually or on
# main; after the first green run, task 3.3 says to flip it to required.
#
# check_skips.sh is what makes this job honest: with BARISTA_TEST_RUNTIME=hypeman
# and CI set, a test that silently skipped would fail the job — so a green here
# means the substrate tier actually ran, not that it was politely avoided.

name: acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this tier only reads the checkout; nothing here writes back
# to the repo, comments, or deploys.
permissions:
  contents: read

jobs:
  hypeman:
    runs-on: ubuntu-latest # amd64 — see header for why that is load-bearing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Enable /dev/kvm for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm # fail here, with a name, rather than in a guest boot

      # Same dependency set .tools/nap-linux.yaml provisions, same reasons:
      # erofs-utils or every image conversion fails with the cause only in the
      # daemon's journal (findings §4).
      - name: Install substrate dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends erofs-utils e2fsprogs

      - name: Install hypeman
        env:
          # Pinned substrate: the anonymous api.github.com "latest" lookup the
          # installer does by default is rate-limited per runner IP and fails
          # intermittently — and a tier whose green must mean something wants
          # its numbers from a named substrate version anyway. Bump these
          # together with the installer ref below when moving the tier forward.
          VERSION: v0.3.0
          CLI_VERSION: v0.17.0
        run: |
          # Commit-pinned and checksum-verified rather than `curl get.hypeman.sh | bash`:
          # the redirect domain and the branch it points at are both mutable, and a
          # script piped straight into bash on a runner is the classic supply-chain
          # hole. The ref and the checksum move together when the installer is bumped.
          HYPEMAN_INSTALL_REF=eed540fc99c36a8f8ad90ff16cb23b03880f619c
          HYPEMAN_INSTALL_SHA256=32463d434403aab0a463849432ee8daa700d03e4c5ce3071e1d1a0c17d0e49dc
          curl -fsSL "https://raw.githubusercontent.com/kernel/hypeman/${HYPEMAN_INSTALL_REF}/scripts/install.sh" \
            -o /tmp/hypeman-install.sh
          echo "${HYPEMAN_INSTALL_SHA256}  /tmp/hypeman-install.sh" | sha256sum --check
          bash /tmp/hypeman-install.sh

      # Findings §9: a Linux release install can never prepare the builder
      # image. v0.3.0's startup docker-builds its *embedded* builder Dockerfile
      # with **cwd as build context**, and the installer's unit starts the
      # service at `/` under ProtectSystem=strict — so the COPY directives find
      # nothing and the docker socket is not even connectable. Worse, 0.3.0
      # marks the builder ready on a deferred flag even when preparation
      # failed, so `hypeman build` proceeds and dies with `create builder
      # instance: image is required`. Give the service the v0.3.0 source tree
      # as its cwd and the socket as a writable path, restart, and wait for
      # preparation's verdict here — with the reason in view — rather than ten
      # minutes later in T7 with the cause out of the journal window.
      - name: Prepare the substrate's builder image (findings §9)
        run: |
          sudo git clone --quiet --branch v0.3.0 --depth 1 \
            https://github.com/kernel/hypeman /opt/hypeman-src
          # Same Dockerfile the binary embeds (verified: go:embed of this path
          # at v0.3.0); building it now warms the layer cache so the service's
          # own build is quick.
          docker build --quiet -t hypeman-builder-cache \
            -f /opt/hypeman-src/lib/builds/images/generic/Dockerfile /opt/hypeman-src
          sudo mkdir -p /etc/systemd/system/hypeman.service.d
          printf '[Service]\nWorkingDirectory=/opt/hypeman-src\nReadWritePaths=/var/run/docker.sock\n' \
            | sudo tee /etc/systemd/system/hypeman.service.d/builder-context.conf
          # Findings §10: the registry rides the API's plain-HTTP listener, but
          # the config default (`registry.insecure: false`) tells the builder
          # VM's BuildKit to push over HTTPS — every push fails out of the box
          # with "server gave HTTP response to HTTPS client". Say what is true.
          printf 'registry:\n  insecure: true\n' | sudo tee -a /etc/hypeman/config.yaml
          sudo systemctl daemon-reload
          SINCE=$(date '+%Y-%m-%d %H:%M:%S')
          sudo systemctl restart hypeman
          echo "waiting for builder-image preparation (docker build + ext4 conversion)…"
          timeout 600s bash -c "until sudo journalctl -u hypeman --since '$SINCE' --no-pager \
            | grep -qE 'builder image ready|failed to build builder image'; do sleep 5; done"
          sudo journalctl -u hypeman --since "$SINCE" --no-pager | grep -E 'builder image|embedded' || true
          sudo journalctl -u hypeman --since "$SINCE" --no-pager | grep -q 'builder image ready' \
            || { echo 'builder image preparation failed — see journal lines above'; exit 1; }
          # Ubuntu 24.04: systemd-resolved holds :5353, hypeman's ingress DNS
          # crash-loops on it (findings §3). Same port move as the Lima VM.
          if [ -f /etc/hypeman/config.yaml ]; then
            sudo sed -i "s/^  internal_dns_port: 5353/  internal_dns_port: 5354/" /etc/hypeman/config.yaml
            sudo systemctl restart hypeman || true
          fi

      # SHA-pinned: `@master` is a mutable ref (same pin as ci.yml).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point Taskfile tools at CI binaries
        run: |
          mkdir -p .tools/protoc-dist/bin
          ln -sf "$(command -v protoc)" .tools/protoc-dist/bin/protoc

      - name: Build the guest agent (linux/musl, amd64)
        run: task guest-bin

      - name: Substrate-gated acceptance tests
        env:
          BARISTA_TEST_RUNTIME: hypeman
        run: |
          set -o pipefail
          cargo test --locked -p barista-node-agent -- --show-output 2>&1 | tee /tmp/barista-test-output.log
          scripts/check_skips.sh /tmp/barista-test-output.log

      # T7 end to end — the north star, on an unpatched substrate for the first
      # time. Steps mirror the README quickstart.
      - name: T7 agent-session scenario
        run: |
          cargo build --locked -p barista-node-agent -p barista-cli
          # Findings §8: the substrate's build mirror resolves a multi-arch
          # index digest to the platform manifest and then pushes it under the
          # index digest, which its own registry correctly refuses — so any
          # digest-pinned FROM fails as `build failed: build failed`. Strip the
          # pin for this build only: the pin exists for cross-run restore-key
          # stability (Dockerfile comment, B29), and this runner keeps no
          # snapshots across runs, so here it protects nothing.
          sed -i 's/@sha256:[a-f0-9]*//' scenario/Dockerfile
          # Capture the digest the build prints: the node refuses an unpinned
          # template (nap-011 — a tag can be repointed under a snapshot, and the
          # restore key derives from the digest), so T7 must create by digest
          # like every real consumer. The build's own report is the source: the
          # same digest BuildKit exported and pushed.
          hypeman build --image-name barista-scenario ./scenario | tee /tmp/hypeman-build.log
          DIGEST=$(grep -oE 'Build Complete: sha256:[a-f0-9]+' /tmp/hypeman-build.log | tail -1 | cut -d' ' -f3)
          test -n "$DIGEST" # fail here, with a name, rather than at create
          echo "scenario image digest: $DIGEST"
          mkdir -p /tmp/barista-data
          # The *binary* takes its token from the environment only
          # (`HypemanConfig::from_env`, src/main.rs). The ~/.config/hypeman/cli.yaml
          # fallback lives in tests/common/mod.rs and is test-only, which is why the
          # step above needs no token and this one does: without it every call to the
          # substrate 401s and T7 fails looking like a substrate fault.
          sed -n 's/^api_key: *"\(.*\)"/\1/p' ~/.config/hypeman/cli.yaml > /tmp/hypeman.token
          test -s /tmp/hypeman.token # fail here, with a name, rather than on the first 401
          BARISTA_HYPEMAN_TOKEN_FILE=/tmp/hypeman.token \
            ./target/debug/barista-node-agent \
              --data-dir /tmp/barista-data --listen 127.0.0.1:7777 \
              --runtime hypeman --guest-bin .tools/guest/barista-guest-agent &
          # Wait for the listener rather than guessing: a debug binary's first start
          # on a cold runner is slower than any fixed sleep worth writing.
          timeout 60s bash -c 'until ss -tln | grep -q 127.0.0.1:7777; do sleep 1; done'
          PATH="$PWD/target/debug:$PATH" python3 scenario/run_scenario.py \
            --node 127.0.0.1:7777 \
            --image "docker.io/library/barista-scenario:latest@${DIGEST}" \
            --pause-seconds 60

      # The findings doc's recurring lesson (§1, §3, §4): the substrate answers
      # `failed` and puts the reason nowhere but its own journal. Dump it while
      # the runner still exists, so the next opaque failure — today's is
      # `hypeman build` → "build failed: build failed" — arrives with its cause
      # attached instead of costing another blind run.
      - name: Substrate journal (on failure)
        if: failure()
        run: sudo journalctl -u hypeman --no-pager -n 500 || true
