# Keep dependencies current without a human remembering to. Grouped minor/patch
# updates so a quiet week is one PR, not twenty. Cargo and Actions are the real
# supply chain; `uv` covers the Python scenario/tooling workspace (py/*).
# npm is intentionally absent: package.json declares no dependencies (openspec
# is installed globally in CI), so there is nothing to update.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      # The gRPC stack versions together (tonic 0.14 requires prost 0.14 and
      # splits codegen into tonic-prost-build), so its updates must arrive as
      # one PR — individually they are unmergeable by construction, which is
      # how #6/#7/#11/#18 all went red. First group wins, so majors included.
      grpc-stack:
        patterns: ["tonic*", "prost*"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
