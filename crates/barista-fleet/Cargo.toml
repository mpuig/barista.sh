[package]
name = "barista-fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Phase 2's coordination layer (ADR-002, nap-017). A separate crate on purpose:
# the node agent consumes it to *own* sessions, and Phase 5's gateway will
# consume it to *resolve* them read-only. Folding it into the node agent would
# make the gateway link the whole agent or reimplement the protocol — the drift
# the schema-first rule exists to prevent, one layer up (design decision 1).

[dependencies]
object_store.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
barista-proto = { path = "../barista-proto" }
prost.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
ulid.workspace = true
tempfile.workspace = true
