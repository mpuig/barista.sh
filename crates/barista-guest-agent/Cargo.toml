[package]
name = "barista-guest-agent"
description = "Barista Guest Agent — in-sandbox daemon (Contract C)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "barista-guest-agent"
path = "src/main.rs"

# Dependencies are deliberately lean: this binary ships inside every sandbox and
# carries a < 10 MB static-musl budget (design decision 2). No tracing
# subscriber (logs go to the sandbox's stderr), no `nix` (raw `libc` covers the
# PTY ioctls we need).
[dependencies]
barista-proto = { path = "../barista-proto" }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }

[lints]
workspace = true
