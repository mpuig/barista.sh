[package]
name = "barista-guest-agent"
description = "Barista Guest Agent — in-sandbox daemon (Contract C)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "barista-guest-agent"
path = "src/main.rs"

# Dependencies are deliberately lean: this binary ships inside every sandbox and
# carries a < 10 MB static-musl budget (design decision 2). No tracing
# subscriber (logs go to the sandbox's stderr), no `nix` (raw `libc` covers the
# PTY ioctls we need).
[dependencies]
barista-proto = { path = "../barista-proto" }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
# The channel's mutual TLS (barista-021). `ring` rather than `aws-lc-rs`: this
# binary is a static aarch64-musl build, and `ring` is the provider that
# cross-compiles there without a C toolchain in the image. Measured cost against
# the 10 MB budget is recorded in the change's task 5.4.
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = { workspace = true, features = ["ring"] }
# The unix-socket connector for the workload idle client (barista-031). Not a
# new tree against the size budget: tonic's transport already compiles both, so
# naming them here only makes the connector reachable from non-test code.
tower = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only. The guest mints nothing in production — the node agent does, and
# this crate deliberately does not depend on it (a static-musl binary under a
# size budget). So the tests grow their own certificates rather than importing
# the node's `identity::mint`.
rcgen = { workspace = true }

[lints]
workspace = true
